# rose-pine-geist v2 — single source of truth (v1 frozen in palette-v1.toml).
# v2 change: upper neutral rungs (highlight_low/overlay/highlight_med/
# highlight_high) tinted toward the text ramp's violet (OKLCH H 290, C 0.010,
# Geist lightness kept) to stop neutral greys reading yellowish next to the
# purple-tinted text. Moon-pine experiment tried and reverted: stock pine's
# dimness quiets the code down — tasteful accent rhythm over uniformity.
# Rose Pine accents on a neutral near-black ground.
#
# Role names follow upstream Rose Pine (https://rosepinetheme.com/palette/)
# so every generated target maps the same role the same way:
#   base          editor / terminal background
#   surface       panels, statusline, floats, ANSI black
#   overlay       popup menus, inputs
#   highlight_low cursorline / subtle hover
#   highlight_med visual & terminal selection
#   highlight_high borders, prominent UI lines
#
# Neutral ramp donors:
#   #101010 Vesper editor.background
#   #161616 Vesper tab.activeBackground
#   #1a1a1a Geist dark gray-100
#   #1f1f1f Geist dark gray-200
#   #2e2e2e Geist dark gray-400 (Vesper hover #282828, Vesper selection ≈ #333)
#   #454545 Geist dark gray-500 (Vesper line numbers #505050)
#   #0d0d0d interpolated (dimmed inactive bg; between Geist bg #0a0a0a and base)
# Accents + text tones: stock Rose Pine (main variant).
# Note: text/subtle/muted carry Rose Pine's slight purple tint by design —
# desaturate here later if they read too warm on the neutral ground.

[meta]
name = "rose-pine-geist"
description = "Rose Pine accents on a neutral near-black ground (Vesper/Geist greys)"

[palette]
# --- neutrals ---
# Variant A: Vesper/Geist mix (pretty good — kept for A/B)
# nc = "#0d0d0d"            # interpolated
# base = "#101010"          # Vesper editor.background
# surface = "#161616"       # Vesper tab.activeBackground
# highlight_low = "#1a1a1a" # Geist gray-100
# overlay = "#1f1f1f"       # Geist gray-200
# highlight_med = "#2e2e2e" # Geist gray-400
# highlight_high = "#454545" # Geist gray-500

# Variant B: pure Geist dark, Geist-flat laddering
# nc = "#000000"             # Geist background-200
# base = "#0a0a0a"           # Geist background-100
# surface = "#1a1a1a"        # Geist gray-100
# highlight_low = "#1f1f1f"  # Geist gray-200
# overlay = "#292929"        # Geist gray-300
# highlight_med = "#2e2e2e"  # Geist gray-400
# highlight_high = "#454545" # Geist gray-500

# Variant C (active): Geist colors, catppuccin-style layering.
# Secondary surfaces recede BELOW the editor (crust/mantle < base),
# interactive states rise above it (surface0/1/2 analogs).
nc = "#000000"             # Geist background-200 (catppuccin: mantle)
surface = "#000000"        # Geist background-200 (catppuccin: mantle — floats/statusline darker than editor)
base = "#0a0a0a"           # Geist background-100 (catppuccin: base)
# Upper rungs carry a mild rose-pine cast: same OKLCH lightness as the
# Geist grey noted, hue 290 (matches text ramp), chroma 0.010 (~1/4 of
# stock rose pine's surface chroma). Kills the yellow-cast illusion that
# dead-neutral greys get next to violet-tinted text. Ground (nc/surface/
# base) stays exact Geist — tint is imperceptible below ~L 0.15.
# C 0.010 (mild — beat neutral, but whisper below beat it; kept for A/B):
# highlight_low = "#1a191e"  # Geist gray-100 tinted (was #1a1a1a)
# overlay = "#1f1e24"        # Geist gray-200 tinted (was #1f1f1f)
# highlight_med = "#2e2d33"  # Geist gray-400 tinted (was #2e2e2e)
# highlight_high = "#45444a" # Geist gray-500 tinted (was #454545)
# C 0.006 (whisper):
highlight_low = "#1a1a1d"  # Geist gray-100 tinted (was #1a1a1a)
overlay = "#1f1f22"        # Geist gray-200 tinted (was #1f1f1f)
highlight_med = "#2e2e31"  # Geist gray-400 tinted (was #2e2e2e)
highlight_high = "#454548" # Geist gray-500 tinted (was #454545)

# --- stock rose pine (main) ---
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
# pine: from Rose Pine MOON variant (main = #31748f, kept in v1; dawn's
# #286983 is darker still — not a candidate for fixing dimness).
pine = "#31748f"
# pine = "#3e8fb0"
foam = "#9ccfd8"
iris = "#c4a7e7"
leaf = "#95b1ac"
